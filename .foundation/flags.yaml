  - created_at: 2026-08-05T09:06:11.935Z
    detail: UpdaterFlattenedDeployTest applies a real update package against base_path()/public_path(),
      so the suite rewrites public/index.php, public/build/**, and base_path('build/**') in the
      working copy. Cleanup restores public/build/manifest.json and removes base_path('build'), but
      nothing restores public/index.php or files the overlay adds under public/build/assets. A
      Foundation intake run on 2026-08-05 found public/index.php replaced with package content after
      `php artisan test`, which had to be recovered with `git checkout`.
    id: flag.maintenance-depot.updater-tests-overlay-files-into-the-real-application-tree-ins
    locations:
      - excerpt: $result = app(UpdaterService::class)->applyUpdate();
        file: tests/Feature/UpdaterFlattenedDeployTest.php
        line: 60
        matched_rule: test_writes_to_app_root
        note: Runs the real overlay against the live checkout
      - excerpt: $this->assertFileExists(base_path('public/build/manifest.json'));
        file: tests/Feature/UpdaterFlattenedDeployTest.php
        line: 66
        matched_rule: test_writes_to_app_root
        note: Asserts on files written into the repository's public/ directory
      - excerpt: "} finally {"
        file: tests/Feature/UpdaterFlattenedDeployTest.php
        line: 68
        matched_rule: incomplete_cleanup
        note: Cleanup block restores build/manifest.json but never restores public/index.php
      - file: public/index.php
        matched_rule: clobbered_artifact
        note: File observed replaced by package content after a test run
    project_id: maintenance-depot
    recommended_action: Point the updater at an isolated temp root in tests (inject the deploy root, or
      copy the relevant public/ and build/ files into a per-test directory), and assert the working
      tree is clean after the suite runs.
    risk: A test suite that mutates the deployed front controller can leave a developer or CI checkout
      in a broken, silently-wrong state; if the same tree is ever deployed or committed, the app
      boots from package paths that do not exist on shared hosting.
    severity: high
    source: manual
    status: open
    title: Updater tests overlay files into the real application tree instead of a sandbox
    updated_at: 2026-08-05T09:06:11.935Z
